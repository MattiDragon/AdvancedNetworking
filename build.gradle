plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version + "+mc." + project.minecraft_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    mavenLocal()
    maven {
        url "https://maven.kneelawk.com/releases/"
        content {
            includeGroupByRegex "com\\.kneelawk.*"
        }
    }
    maven {
        url "https://maven.alexiil.uk/"
        content {
            includeGroup "alexiil.mc.lib"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.mattidragon"
            includeGroup "com.github.llamalad7.mixinextras"
        }
    }
    maven {
        url "https://maven.isxander.dev/releases"
        content {
            includeGroup "dev.isxander"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url 'https://maven.cafeteria.dev/releases/'
        content {
            includeGroup "me.luligabi"
        }
    }
    maven {
        url "https://maven.terraformersmc.com"
        content {
            includeGroup "com.terraformersmc"
        }
    }
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
        content {
            includeGroup "com.twelvemonkeys.common"
            includeGroup "com.twelvemonkeys.imageio"
            includeGroup "com.twelvemonkeys"
        }
    }
    maven {
        url 'https://maven.quiltmc.org/repository/release/'
        content {
            includeGroup "org.quiltmc.parsers"
        }
    }
    mavenCentral()
}

loom.splitEnvironmentSourceSets()
fabricApi.configureDataGeneration {
    addToResources = false
    client = true
    createSourceSet = true
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings "net.fabricmc:yarn:$yarn_mappings:v2"
    modImplementation "net.fabricmc:fabric-loader:$loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"

    // Core apis
    modImplementation include("io.github.mattidragon:nodeflow:$nodeflow_version")
    include modImplementation("com.kneelawk.graphlib:graphlib-core-fabric:$graphlib_version")
    //modLocalRuntime("com.kneelawk.graphlib:graphlib-debugrender-fabric:$graphlib_version")
    include modApi("teamreborn:energy:$energy_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Config
    modImplementation "com.terraformersmc:modmenu:$modmenu_version"
    modImplementation include("dev.isxander:yet-another-config-lib:$yacl_version-fabric")
    modImplementation annotationProcessor(include("com.github.mattidragon:configtoolkit:$configtoolkit_version"))

    // Add generated data to runtime classpath (slightly hacky)
    runtimeOnly files("src/main/generated")
}

sourceSets {
    testmod {
        compileClasspath += client.compileClasspath
        compileClasspath += client.output
        runtimeClasspath += client.runtimeClasspath
        runtimeClasspath += client.output
    }
}

loom {
    runs {
        testmodClient {
            client()
            name "Testmod Client"
            source sourceSets.testmod
            runDir "run/test"
        }
        testmodServer {
            server()
            name "Testmod Server"
            source sourceSets.testmod
            runDir "run/test_server"
        }
        gametest {
            server()
            name "Gametest"
            source sourceSets.testmod
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest_server"
        }
    }

    // Apply datagen at runtime
    mods {
        extended_drawers {
            sourceSet sourceSets.main
            modFiles.from file("src/main/generated")
        }
    }

    accessWidenerPath = file("src/main/resources/advanced_networking.accesswidener")
}

test.dependsOn(tasks.runGametest)

// Delete datagen on clean
clean.delete("src/main/generated")

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    // Copy datagen to jar
    dependsOn tasks.runDatagen
    from("src/main/generated") {
        exclude "README.md"
        exclude ".cache"
    }
}

publishing {
    publications.register("mavenJava", MavenPublication) {
        from components.java
    }

    repositories {

    }
}
